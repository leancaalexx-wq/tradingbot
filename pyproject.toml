[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-btc-scalper"
version = "0.1.0"
description = "Paper-first Polymarket BTC 5-minute Up/Down trading bot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
live = ["py-clob-client>=0.34.6"]

[project.scripts]
polymarket-btc-bot = "polymarket_bot.__main__:main"
polymarket-btc-dashboard = "polymarket_bot.dashboard:main"

[tool.setuptools.packages.find]
include = ["polymarket_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
